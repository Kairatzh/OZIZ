<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZIZ — публичный реестр городских обращений</title>
    <meta name="description" content="Сфотографируйте проблему, отметьте точку на карте. ИИ определит приоритет, служба получит заявку, а каждый статус будет записан в публичный реестр Solana." />
    <meta property="og:title" content="OZIZ — публичный реестр городских обращений" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('oziz-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
